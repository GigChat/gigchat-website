<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GigChat Navigation</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --ink: #171327;
      --muted: rgba(45, 35, 78, 0.58);
      --panel: rgba(255, 255, 255, 0.86);
      --panel-solid: #ffffff;
      --violet: #7c3cff;
      --violet-2: #9b5cff;
      --lavender: #f4efff;
      --shadow: 0 18px 50px rgba(89, 55, 180, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f6f1ff;
      color: var(--ink);
    }

    .screen {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(190, 158, 255, 0.44), transparent 32%),
        radial-gradient(circle at 90% 88%, rgba(147, 91, 255, 0.22), transparent 36%),
        linear-gradient(180deg, #fbf9ff 0%, #eee6ff 100%);
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #f6f1ff;
    }

    .lavender-tiles {
      filter:
        grayscale(0.9)
        sepia(0.18)
        saturate(0.7)
        hue-rotate(222deg)
        brightness(1.16)
        contrast(0.82);
      opacity: 0.47;
    }

    .map-veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.08), rgba(238, 226, 255, 0.46)),
        linear-gradient(180deg, rgba(250, 247, 255, 0.18), rgba(246, 240, 255, 0.42));
    }

    .top-pill {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(124, 60, 255, 0.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .g-mark {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      background: linear-gradient(135deg, #ff4f9a, #7c3cff);
      box-shadow: 0 8px 22px rgba(124, 60, 255, 0.32);
    }

    .turn-card {
      position: absolute;
      top: calc(82px + env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      z-index: 20;
      min-height: 86px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(124, 60, 255, 0.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .turn-icon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--violet);
      background: rgba(124, 60, 255, 0.08);
      font-size: 30px;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .turn-main {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.08;
      color: var(--ink);
    }

    .turn-sub {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 650;
      color: var(--muted);
    }

    .eta-chip {
      position: absolute;
      left: 18px;
      bottom: calc(124px + env(safe-area-inset-bottom));
      z-index: 20;
      min-width: 105px;
      padding: 14px 16px;
      border-radius: 999px;
      background: rgba(18, 18, 24, 0.88);
      color: white;
      box-shadow: 0 18px 38px rgba(18, 18, 24, 0.24);
      backdrop-filter: blur(16px);
      font-weight: 900;
      text-align: center;
    }

    .eta-chip span {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .eta-chip small {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.68);
      font-weight: 700;
    }

    .recenter {
      position: absolute;
      right: 18px;
      bottom: calc(124px + env(safe-area-inset-bottom));
      z-index: 20;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--violet);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
    }

    .bottom-sheet {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 20;
      border-radius: 28px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(124, 60, 255, 0.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
    }

    .metric {
      min-width: 0;
    }

    .metric strong {
      display: block;
      font-size: 28px;
      line-height: 1;
      color: var(--violet);
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .start-btn {
      width: 100%;
      border: 0;
      border-radius: 22px;
      padding: 18px 16px;
      color: white;
      background: linear-gradient(135deg, #ff4f9a 0%, #7c3cff 72%);
      box-shadow: 0 18px 36px rgba(124, 60, 255, 0.24);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .start-btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .error {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(26px + env(safe-area-inset-bottom));
      z-index: 40;
      display: none;
      padding: 16px;
      border-radius: 18px;
      color: #9d174d;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      line-height: 1.35;
      font-weight: 750;
    }

    .service-marker {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--violet);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 13px 28px rgba(124, 60, 255, 0.22);
      border: 1px solid rgba(124, 60, 255, 0.14);
      font-size: 22px;
      font-weight: 900;
    }

    .provider-marker {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .provider-marker .pulse {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: rgba(124, 60, 255, 0.16);
      animation: pulse 1.8s ease-out infinite;
    }

    .provider-marker .dot {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8d45ff, #671eff);
      border: 6px solid white;
      box-shadow: 0 16px 36px rgba(124, 60, 255, 0.42);
    }

    @keyframes pulse {
      0% {
        transform: scale(0.7);
        opacity: 0.95;
      }

      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }

    .leaflet-control-attribution {
      display: none;
    }

    .leaflet-container {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
  </style>
</head>

<body>
  <main class="screen">
    <div id="map"></div>
    <div class="map-veil"></div>

    <div class="top-pill">
      <div class="g-mark">G</div>
      <div>Navigation</div>
    </div>

    <section class="turn-card">
      <div class="turn-icon">&#8599;</div>
      <div>
        <div id="turnMain" class="turn-main">Ready to start</div>
        <div id="turnSub" class="turn-sub">Live ETA stays inside GigChat</div>
      </div>
    </section>

    <div class="eta-chip">
      <span id="etaChip">--</span>
      <small>ETA</small>
    </div>

    <button id="recenterBtn" class="recenter" type="button">&#8982;</button>

    <section class="bottom-sheet">
      <div class="bottom-row">
        <div class="metric">
          <strong id="etaMain">Ready</strong>
          <span id="distanceMain">Secure navigation</span>
        </div>

        <button id="navBtn" class="start-btn" disabled type="button">
          Start live navigation
        </button>
      </div>

      <div id="navStatus" class="status"></div>
    </section>

    <div id="error" class="error"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_BASE = "https://ohpsfazyxduzacwdjyrv.functions.supabase.co/rapid-task";

    const navBtn = document.getElementById("navBtn");
    const navStatusEl = document.getElementById("navStatus");
    const errorEl = document.getElementById("error");
    const etaChipEl = document.getElementById("etaChip");
    const etaMainEl = document.getElementById("etaMain");
    const distanceMainEl = document.getElementById("distanceMain");
    const turnMainEl = document.getElementById("turnMain");
    const turnSubEl = document.getElementById("turnSub");
    const recenterBtn = document.getElementById("recenterBtn");

    let currentToken = "";
    let exactLat = null;
    let exactLng = null;

    let map = null;
    let serviceMarker = null;
    let providerMarker = null;
    let routeLine = null;
    let routeGlowLine = null;
    let watchId = null;
    let lastPingAt = 0;
    let lastProviderLatLng = null;
    let wakeLock = null;

    function getToken() {
      const url = new URL(window.location.href);
      const queryToken = url.searchParams.get("token");
      if (queryToken) return queryToken.trim();

      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1] || "";
    }

    function setStatus(message) {
      navStatusEl.textContent = message || "";
    }

    function showError(message) {
      errorEl.style.display = "block";
      errorEl.textContent = message || "Something went wrong.";
    }

    function formatDistance(meters) {
      const n = Number(meters);

      if (!Number.isFinite(n) || n <= 0) return "--";

      const miles = n / 1609.344;
      if (miles < 0.1) return Math.round(n) + " m";
      if (miles < 10) return miles.toFixed(1) + " mi";
      return Math.round(miles) + " mi";
    }

    function updateEtaUI(data) {
      const minutes = data && data.eta_minutes ? Number(data.eta_minutes) : null;
      const distance = data && data.eta_distance_meters ? Number(data.eta_distance_meters) : null;

      if (Number.isFinite(minutes)) {
        etaChipEl.textContent = minutes + " min";
        etaMainEl.textContent = minutes + " min";
        turnMainEl.textContent = "Live navigation active";
        turnSubEl.textContent = "ETA updated through GigChat";
      }

      if (Number.isFinite(distance)) {
        distanceMainEl.textContent = formatDistance(distance) + " remaining";
      }
    }

    function getProviderPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Location sharing is not available on this device."));
          return;
        }

        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 14000,
          maximumAge: 8000,
        });
      });
    }

    async function requestWakeLock() {
      try {
        if (!("wakeLock" in navigator)) return;
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (_err) {
        wakeLock = null;
      }
    }

    function serviceIcon() {
      return L.divIcon({
        className: "",
        html: '<div class="service-marker">&#10022;</div>',
        iconSize: [42, 42],
        iconAnchor: [21, 42],
      });
    }

    function providerIcon() {
      return L.divIcon({
        className: "",
        html: '<div class="provider-marker"><div class="pulse"></div><div class="dot"></div></div>',
        iconSize: [44, 44],
        iconAnchor: [22, 22],
      });
    }

    function createMap(lat, lng) {
      map = L.map("map", {
        zoomControl: false,
        attributionControl: false,
        dragging: true,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        touchZoom: true,
      }).setView([lat, lng], 15);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        className: "lavender-tiles",
      }).addTo(map);

      serviceMarker = L.marker([lat, lng], {
        icon: serviceIcon(),
      }).addTo(map);
    }

    function setRouteLines(points, fitMap) {
      if (!Array.isArray(points) || points.length < 2) return false;

      if (!routeGlowLine) {
        routeGlowLine = L.polyline(points, {
          color: "#ffffff",
          weight: 12,
          opacity: 0.86,
          lineCap: "round",
          lineJoin: "round",
        }).addTo(map);
      } else {
        routeGlowLine.setLatLngs(points);
      }

      if (!routeLine) {
        routeLine = L.polyline(points, {
          color: "#7c3cff",
          weight: 6,
          opacity: 0.9,
          lineCap: "round",
          lineJoin: "round",
        }).addTo(map);
      } else {
        routeLine.setLatLngs(points);
      }

      if (serviceMarker && typeof serviceMarker.setZIndexOffset === "function") serviceMarker.setZIndexOffset(900);
      if (providerMarker && typeof providerMarker.setZIndexOffset === "function") providerMarker.setZIndexOffset(1000);

      if (fitMap) {
        const bounds = L.latLngBounds(points);

        map.fitBounds(bounds, {
          paddingTopLeft: [80, 170],
          paddingBottomRight: [80, 180],
          maxZoom: 16,
          animate: true,
        });
      }

      return true;
    }

    function drawStraightRouteFallback(lat, lng) {
      return setRouteLines([[lat, lng], [exactLat, exactLng]], true);
    }

    function decodeGooglePolyline(encoded) {
      if (!encoded || typeof encoded !== "string") return [];

      let index = 0;
      let lat = 0;
      let lng = 0;
      const points = [];

      while (index < encoded.length) {
        let b;
        let shift = 0;
        let result = 0;

        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20 && index < encoded.length);

        const deltaLat = (result & 1) ? ~(result >> 1) : result >> 1;

        shift = 0;
        result = 0;

        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20 && index < encoded.length);

        const deltaLng = (result & 1) ? ~(result >> 1) : result >> 1;

        lat += deltaLat;
        lng += deltaLng;

        points.push([lat / 1e5, lng / 1e5]);
      }

      return points;
    }

    function simplifyRoutePoints(points, maxPoints) {
      if (!Array.isArray(points) || points.length <= maxPoints) return points;

      const step = Math.ceil(points.length / maxPoints);
      const simplified = [];

      for (let i = 0; i < points.length; i += step) {
        simplified.push(points[i]);
      }

      simplified.push(points[points.length - 1]);
      return simplified;
    }

    function drawEncodedRoute(encoded) {
      const points = decodeGooglePolyline(encoded);

      if (points.length < 2) return false;

      const displayPoints = simplifyRoutePoints(points, 1800);
      return setRouteLines(displayPoints, true);
    }

    function drawProviderPosition(lat, lng) {
      lastProviderLatLng = [lat, lng];

      if (!providerMarker) {
        providerMarker = L.marker([lat, lng], {
          icon: providerIcon(),
        }).addTo(map);
      } else {
        providerMarker.setLatLng([lat, lng]);
      }

      if (!routeLine) {
        drawStraightRouteFallback(lat, lng);
      }

      if (providerMarker && typeof providerMarker.setZIndexOffset === "function") providerMarker.setZIndexOffset(1000);
    }

    async function sendProviderLocationPing(position) {
      const coords = position.coords || {};

      const res = await fetch(API_BASE + "?task=provider_location_ping", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          token: currentToken,
          latitude: coords.latitude,
          longitude: coords.longitude,
          accuracy: coords.accuracy,
        }),
      });

      const data = await res.json();

      if (!res.ok || !data.ok) {
        throw new Error(data.error || "Could not send live ETA.");
      }

      return data;
    }

    async function handlePosition(position, forcePing) {
      const coords = position.coords || {};

      if (!Number.isFinite(coords.latitude) || !Number.isFinite(coords.longitude)) {
        throw new Error("Invalid provider location.");
      }

      drawProviderPosition(coords.latitude, coords.longitude);

      const now = Date.now();
      const shouldPing = forcePing || now - lastPingAt >= 30000;

      if (!shouldPing) return;

      lastPingAt = now;
      setStatus("Updating live ETA...");

      const eta = await sendProviderLocationPing(position);
      updateEtaUI(eta);

      let routeLoaded = false;
      let routeError = "";

      try {
        routeLoaded = drawEncodedRoute(eta && eta.encoded_polyline);
      } catch (err) {
        routeLoaded = false;
        routeError = err && err.message ? err.message : String(err || "route render failed");
        console.warn("ROUTE RENDER FAILED:", err);
      }

      if (routeLoaded && eta && eta.customer_notified) {
        setStatus("Google route loaded. Customer notified.");
      } else if (routeLoaded) {
        setStatus("Google route loaded.");
      } else if (routeError) {
        setStatus("Route render failed: " + routeError.slice(0, 120));
      } else if (eta && eta.customer_notified) {
        setStatus("Straight-line fallback. Customer notified.");
      } else {
        setStatus("Straight-line fallback.");
      }
    }

    async function startLiveNavigation() {
      navBtn.disabled = true;
      navBtn.textContent = "Starting...";
      setStatus("Requesting location permission...");

      try {
        await requestWakeLock();

        const position = await getProviderPosition();
        await handlePosition(position, true);

        turnMainEl.textContent = "Live navigation active";
        turnSubEl.textContent = "Keep this page open for live ETA";
        navBtn.textContent = "Live navigation on";
        navBtn.disabled = true;

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
        }

        watchId = navigator.geolocation.watchPosition(
          async (nextPosition) => {
            try {
              await handlePosition(nextPosition, false);
            } catch (err) {
              console.warn("LIVE ETA UPDATE FAILED:", err);
              setStatus("Live ETA paused. Checking again...");
            }
          },
          (err) => {
            console.warn("LOCATION WATCH FAILED:", err);
            setStatus("Location permission is needed for live ETA.");
          },
          {
            enableHighAccuracy: true,
            timeout: 16000,
            maximumAge: 8000,
          }
        );
      } catch (err) {
        console.warn("LIVE NAVIGATION START FAILED:", err);
        navBtn.disabled = false;
        navBtn.textContent = "Start live navigation";
        const message = err && err.message ? err.message : String(err || "Unknown error");
        setStatus("Live navigation failed: " + message.slice(0, 140));
      }
    }

    function recenter() {
      if (lastProviderLatLng) {
        map.setView(lastProviderLatLng, 16, { animate: true });
        return;
      }

      if (Number.isFinite(exactLat) && Number.isFinite(exactLng)) {
        map.setView([exactLat, exactLng], 15, { animate: true });
      }
    }

    async function load() {
      const token = getToken();
      currentToken = token;

      if (!token) {
        throw new Error("Missing navigation token.");
      }

      const res = await fetch(
        API_BASE + "?task=provider_job_data&token=" + encodeURIComponent(token)
      );

      const data = await res.json();

      if (!data.ok || !data.job) {
        throw new Error(data.error || "Job not found.");
      }

      const job = data.job;

      exactLat = Number(job.service_latitude);
      exactLng = Number(job.service_longitude);

      if (!Number.isFinite(exactLat) || !Number.isFinite(exactLng)) {
        throw new Error("This job does not have map coordinates yet.");
      }

      createMap(exactLat, exactLng);

      navBtn.disabled = false;
      navBtn.addEventListener("click", startLiveNavigation);
      recenterBtn.addEventListener("click", recenter);

      setStatus("Tap Start live navigation when you are on the way.");
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && wakeLock === null && watchId !== null) {
        await requestWakeLock();
      }
    });

    load().catch((err) => {
      showError(err.message || "Something went wrong.");
    });
  </script>
</body>
</html>

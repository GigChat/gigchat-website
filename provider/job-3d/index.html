<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GigChat Navigation</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    :root {
      --ink: #171327;
      --muted: rgba(45, 35, 78, 0.62);
      --violet: #7c3cff;
      --pink: #ff4f9a;
      --shadow: 0 18px 50px rgba(89, 55, 180, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f6f1ff;
      color: var(--ink);
    }

    .screen {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f6f1ff;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .map-veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.02), rgba(238,226,255,0.34)),
        linear-gradient(180deg, rgba(250,247,255,0.06), rgba(246,240,255,0.35));
    }

    .top-pill {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      font-size: 15px;
      font-weight: 850;
    }

    .g-mark {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 950;
      background: linear-gradient(135deg, var(--pink), var(--violet));
    }

    .turn-card {
      position: absolute;
      top: calc(82px + env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      z-index: 20;
      min-height: 86px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255,255,255,0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .turn-icon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--violet);
      background: rgba(124,60,255,0.08);
      font-size: 30px;
      font-weight: 950;
      flex: 0 0 auto;
    }

    .turn-main {
      font-size: 22px;
      font-weight: 950;
      line-height: 1.08;
    }

    .turn-sub {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
    }

    .provider-arrow {
      position: absolute;
      left: 50%;
      bottom: calc(245px + env(safe-area-inset-bottom));
      z-index: 18;
      width: 78px;
      height: 78px;
      transform: translateX(-50%);
      pointer-events: none;
      filter: drop-shadow(0 18px 24px rgba(124,60,255,0.28));
    }

    .provider-arrow::before {
      content: "";
      position: absolute;
      inset: 10px;
      background: linear-gradient(135deg, #22e0ff, #7c3cff);
      clip-path: polygon(50% 0%, 92% 92%, 50% 72%, 8% 92%);
    }

    .provider-arrow::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 48%;
      width: 82px;
      height: 42px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: rgba(124,60,255,0.16);
      z-index: -1;
    }

    .eta-chip {
      position: absolute;
      left: 18px;
      bottom: calc(220px + env(safe-area-inset-bottom));
      z-index: 20;
      min-width: 105px;
      padding: 14px 16px;
      border-radius: 999px;
      background: rgba(18,18,24,0.9);
      color: white;
      box-shadow: 0 18px 38px rgba(18,18,24,0.24);
      backdrop-filter: blur(16px);
      font-weight: 950;
      text-align: center;
    }

    .eta-chip span {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .eta-chip small {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: rgba(255,255,255,0.68);
      font-weight: 750;
    }

    .recenter {
      position: absolute;
      right: 18px;
      bottom: calc(220px + env(safe-area-inset-bottom));
      z-index: 20;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: var(--violet);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      font-size: 28px;
      font-weight: 950;
    }

    .bottom-sheet {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 20;
      border-radius: 28px;
      padding: 16px;
      background: rgba(255,255,255,0.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
    }

    .metric strong {
      display: block;
      font-size: 28px;
      line-height: 1;
      color: var(--violet);
      font-weight: 950;
      letter-spacing: -0.03em;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .start-btn {
      width: 100%;
      border: 0;
      border-radius: 22px;
      padding: 18px 16px;
      color: white;
      background: linear-gradient(135deg, var(--pink) 0%, var(--violet) 72%);
      box-shadow: 0 18px 36px rgba(124,60,255,0.24);
      font-size: 16px;
      font-weight: 950;
    }

    .start-btn:disabled {
      opacity: 0.62;
    }

    .status {
      margin-top: 12px;
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
    }

    .error {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(26px + env(safe-area-inset-bottom));
      z-index: 40;
      display: none;
      padding: 16px;
      border-radius: 18px;
      color: #9d174d;
      background: rgba(255,255,255,0.94);
      box-shadow: var(--shadow);
      line-height: 1.35;
      font-weight: 800;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      display: none;
    }

    /* GigChat 3D navigation dark mode v2 */
    body,
    .screen {
      background: #0b1220;
      color: #ffffff;
    }

    .map-veil {
      background:
        linear-gradient(180deg, rgba(9, 14, 24, 0.08), rgba(9, 14, 24, 0.18)),
        radial-gradient(circle at 50% 60%, rgba(124, 60, 255, 0.05), rgba(5, 9, 16, 0.24));
    }

    .top-pill,
    .turn-card {
      display: none;
    }

    .provider-arrow {
      display: none;
    }

    .screen.live .provider-arrow {
      display: block;
    }

    .bottom-sheet {
      background: rgba(16, 22, 32, 0.94);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.42);
    }

    .metric strong {
      color: #ffffff;
    }

    .metric span,
    .status {
      color: rgba(255, 255, 255, 0.64);
    }

    .start-btn {
      background: linear-gradient(135deg, #ff405f 0%, #ff7a59 100%);
      box-shadow: 0 18px 36px rgba(255, 64, 95, 0.24);
    }

    .eta-chip {
      background: rgba(8, 10, 15, 0.92);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.36);
    }

    .recenter {
      background: rgba(20, 26, 36, 0.94);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }


    /* Provider 3D marker v2 */
    .provider-arrow {
      display: none !important;
    }

    .nav-arrow-marker {
      width: 78px;
      height: 78px;
      pointer-events: none;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.34));
    }

    .nav-arrow-marker::before {
      content: "";
      position: absolute;
      inset: 10px;
      background: linear-gradient(135deg, #21dfff, #7c3cff);
      clip-path: polygon(50% 0%, 92% 92%, 50% 72%, 8% 92%);
    }

    .nav-arrow-marker::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 48%;
      width: 82px;
      height: 42px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: rgba(124, 60, 255, 0.18);
      z-index: -1;
    }


    /* Provider 3D polish v3 */
    .nav-arrow-marker {
      filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.26));
    }

    .nav-arrow-marker::after {
      left: 50%;
      top: 58%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background:
        radial-gradient(circle, rgba(124, 60, 255, 0.28) 0%, rgba(124, 60, 255, 0.16) 42%, rgba(124, 60, 255, 0) 72%);
      z-index: -1;
    }

    .eta-chip {
      background: rgba(16, 22, 32, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.42);
    }

    .recenter {
      display: grid;
      place-items: center;
      position: absolute;
      font-size: 0;
      line-height: 0;
      overflow: hidden;
    }

    .recenter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.86);
    }

    .recenter::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      background:
        linear-gradient(90deg, transparent 0 47%, rgba(255, 255, 255, 0.86) 47% 53%, transparent 53% 100%),
        linear-gradient(0deg, transparent 0 47%, rgba(255, 255, 255, 0.86) 47% 53%, transparent 53% 100%);
      opacity: 0.92;
    }


    /* Small 3D map readability tune */
    .map-veil {
      background:
        linear-gradient(180deg, rgba(9, 14, 24, 0.04), rgba(9, 14, 24, 0.10)),
        radial-gradient(circle at 50% 60%, rgba(124, 60, 255, 0.04), rgba(5, 9, 16, 0.14)) !important;
    }


    /* Dark readable map v10 */
    .map-veil {
      background:
        linear-gradient(180deg, rgba(5, 9, 16, 0.02), rgba(5, 9, 16, 0.08)),
        radial-gradient(circle at 50% 65%, rgba(124, 60, 255, 0.04), rgba(5, 9, 16, 0.08)) !important;
    }


    /* Vector dark map readable labels v11 */
    .map-veil {
      background:
        linear-gradient(180deg, rgba(5, 9, 16, 0.00), rgba(5, 9, 16, 0.04)) !important;
    }


    /* Soften dark map black blocks v12 */


    /* Red guide-color 3D provider arrow v14 */
    .nav-arrow-marker {
      width: 86px;
      height: 86px;
      pointer-events: none;
      filter:
        drop-shadow(0 10px 8px rgba(0, 0, 0, 0.34))
        drop-shadow(0 0 20px rgba(255, 64, 95, 0.34));
    }

    .nav-arrow-marker::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 78px;
      height: 78px;
      transform: translate(-50%, -50%);
      background: #ffffff;
      clip-path: polygon(50% 3%, 91% 89%, 50% 71%, 9% 89%);
      filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.28));
      z-index: 2;
    }

    .nav-arrow-marker::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 59px;
      height: 59px;
      transform: translate(-50%, -52%);
      background:
        linear-gradient(145deg, #ff7b8d 0%, #ff405f 48%, #e9284d 100%);
      clip-path: polygon(50% 4%, 90% 88%, 50% 70%, 10% 88%);
      box-shadow:
        inset 0 4px 8px rgba(255, 255, 255, 0.42),
        inset 0 -7px 11px rgba(130, 0, 25, 0.30),
        0 0 16px rgba(255, 64, 95, 0.42);
      z-index: 3;
    }


    /* GPS turn-by-turn banner v15 */
    .gps-banner {
      position: absolute;
      left: 14px;
      right: 14px;
      top: calc(14px + env(safe-area-inset-top));
      z-index: 30;
      min-height: 92px;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 24px;
      background: rgba(13, 18, 27, 0.94);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .gps-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,0.38), rgba(255,255,255,0) 34%),
        linear-gradient(145deg, #ff7b8d 0%, #ff405f 48%, #e9284d 100%);
      color: #ffffff;
      font-size: 34px;
      font-weight: 950;
      line-height: 1;
      box-shadow:
        inset 0 4px 8px rgba(255, 255, 255, 0.30),
        inset 0 -7px 11px rgba(130, 0, 25, 0.30),
        0 0 18px rgba(255, 64, 95, 0.36);
    }

    .gps-copy {
      min-width: 0;
    }

    .gps-distance {
      font-size: 17px;
      font-weight: 950;
      color: #ff7b8d;
      letter-spacing: 0.01em;
      margin-bottom: 4px;
    }

    .gps-instruction {
      font-size: 20px;
      line-height: 1.08;
      font-weight: 950;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gps-sub {
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.18;
      font-weight: 750;
      color: rgba(255, 255, 255, 0.66);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gps-banner.waiting .gps-icon {
      background: rgba(255, 255, 255, 0.10);
      box-shadow: none;
      color: rgba(255, 255, 255, 0.72);
    }

    @media (max-width: 390px) {
      .gps-banner {
        grid-template-columns: 58px 1fr;
        min-height: 86px;
        padding: 12px 14px;
      }

      .gps-icon {
        width: 52px;
        height: 52px;
        font-size: 30px;
      }

      .gps-instruction {
        font-size: 18px;
      }
    }

  </style>
</head>

<body>
  <main class="screen">
    <div id="map"></div>
    <div class="map-veil"></div>

    <div class="top-pill">
      <div class="g-mark">G</div>
      <div>Navigation</div>
    </div>

    <section class="turn-card">
      <div class="turn-icon">&#8599;</div>
      <div>
        <div id="turnMain" class="turn-main">Ready to start</div>
        <div id="turnSub" class="turn-sub">Live route inside GigChat</div>
      </div>
    </section>

    <div class="provider-arrow" aria-hidden="true"></div>


    <section id="gpsBanner" class="gps-banner waiting" aria-live="polite">
      <div id="gpsIcon" class="gps-icon">↑</div>
      <div class="gps-copy">
        <div id="gpsDistance" class="gps-distance">Waiting for route</div>
        <div id="gpsInstruction" class="gps-instruction">Start navigation</div>
        <div id="gpsSub" class="gps-sub">GigChat will show the next turn here</div>
      </div>
    </section>

    <div class="eta-chip">
      <span id="etaChip">--</span>
      <small>ETA</small>
    </div>

    <button id="recenterBtn" class="recenter" type="button">&#8982;</button>

    <section class="bottom-sheet">
      <div class="bottom-row">
        <div class="metric">
          <strong id="etaMain">Ready</strong>
          <span id="distanceMain">Secure navigation</span>
        </div>

        <button id="navBtn" class="start-btn" disabled type="button">
          Start
        </button>
      </div>

      <div id="navStatus" class="status"></div>
    </section>

    <div id="error" class="error"></div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    const API_BASE = "https://ohpsfazyxduzacwdjyrv.functions.supabase.co/rapid-task";

    const navBtn = document.getElementById("navBtn");
    const navStatusEl = document.getElementById("navStatus");
    const errorEl = document.getElementById("error");
    const etaChipEl = document.getElementById("etaChip");
    const etaMainEl = document.getElementById("etaMain");
    const distanceMainEl = document.getElementById("distanceMain");
    const gpsBannerEl = document.getElementById("gpsBanner");
    const gpsIconEl = document.getElementById("gpsIcon");
    const gpsDistanceEl = document.getElementById("gpsDistance");
    const gpsInstructionEl = document.getElementById("gpsInstruction");
    const gpsSubEl = document.getElementById("gpsSub");
    const turnMainEl = document.getElementById("turnMain");
    const turnSubEl = document.getElementById("turnSub");
    const recenterBtn = document.getElementById("recenterBtn");
    const screenEl = document.querySelector(".screen");

    let currentToken = "";
    let exactLat = null;
    let exactLng = null;
    let map = null;
    let routePoints = [];
    let watchId = null;
    let lastPingAt = 0;
    let followProvider = false;
    let wakeLock = null;
    let lastProviderPoint = null;
    let providerMarker = null;

    function getToken() {
      const url = new URL(window.location.href);
      const queryToken = url.searchParams.get("token");
      if (queryToken) return queryToken.trim();

      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1] || "";
    }

    function setStatus(message) {
      navStatusEl.textContent = message || "";
    }

    function showError(message) {
      errorEl.style.display = "block";
      errorEl.textContent = message || "Something went wrong.";
    }

    function formatDistance(meters) {
      const n = Number(meters);
      if (!Number.isFinite(n) || n <= 0) return "--";

      const miles = n / 1609.344;
      if (miles < 0.1) return Math.round(n) + " m";
      if (miles < 10) return miles.toFixed(1) + " mi";
      return Math.round(miles) + " mi";
    }


    function maneuverIcon(maneuver) {
      const value = String(maneuver || "").toUpperCase();

      if (value.includes("LEFT")) return "↰";
      if (value.includes("RIGHT")) return "↱";
      if (value.includes("ROUNDABOUT")) return "↻";
      if (value.includes("RAMP")) return "↱";
      if (value.includes("MERGE")) return "⇢";
      if (value.includes("DEPART")) return "↑";
      if (value.includes("ARRIVE")) return "✓";
      if (value.includes("UTURN")) return "↶";

      return "↑";
    }

    function cleanGpsInstruction(value) {
      return String(value || "")
        .replace(/\s+/g, " ")
        .replace(/\bToll road\b/gi, "")
        .replace(/\bDestination will be on the right\b/gi, "Destination on the right")
        .replace(/\bDestination will be on the left\b/gi, "Destination on the left")
        .trim();
    }

    function splitGpsInstruction(instruction) {
      const clean = cleanGpsInstruction(instruction);
      if (!clean) {
        return {
          main: "Continue",
          sub: "Follow GigChat route",
        };
      }

      const towardIndex = clean.toLowerCase().indexOf(" toward ");
      if (towardIndex > 0) {
        return {
          main: clean.slice(0, towardIndex).trim(),
          sub: clean.slice(towardIndex + 1).trim(),
        };
      }

      const continueIndex = clean.toLowerCase().indexOf(" continue to follow ");
      if (continueIndex > 0) {
        return {
          main: clean.slice(0, continueIndex).trim(),
          sub: clean.slice(continueIndex + 1).trim(),
        };
      }

      const destinationIndex = clean.toLowerCase().indexOf(" destination ");
      if (destinationIndex > 0) {
        return {
          main: clean.slice(0, destinationIndex).trim(),
          sub: clean.slice(destinationIndex).trim(),
        };
      }

      return {
        main: clean,
        sub: "Live route updated by GigChat",
      };
    }

    function formatStepDistance(meters) {
      const value = Number(meters);
      if (!Number.isFinite(value)) return "";

      if (value < 1000) {
        return Math.max(1, Math.round(value)) + " m";
      }

      return (value / 1000).toFixed(value < 10000 ? 1 : 0) + " km";
    }

    function updateGpsBanner(data) {
      if (!gpsBannerEl || !gpsIconEl || !gpsDistanceEl || !gpsInstructionEl || !gpsSubEl) {
        return;
      }

      const instruction = data && data.next_instruction ? String(data.next_instruction) : "";
      const maneuver = data && data.next_maneuver ? String(data.next_maneuver) : "";
      const distanceMeters =
        data && data.next_step_distance_meters !== undefined
          ? Number(data.next_step_distance_meters)
          : null;

      if (!instruction) {
        gpsBannerEl.classList.add("waiting");
        gpsIconEl.textContent = "↑";
        gpsDistanceEl.textContent = "Waiting for route";
        gpsInstructionEl.textContent = "Start navigation";
        gpsSubEl.textContent = "GigChat will show the next turn here";
        return;
      }

      const parts = splitGpsInstruction(instruction);

      gpsBannerEl.classList.remove("waiting");
      gpsIconEl.textContent = maneuverIcon(maneuver);
      gpsDistanceEl.textContent = formatStepDistance(distanceMeters) || "Next";
      gpsInstructionEl.textContent = parts.main;
      gpsSubEl.textContent = parts.sub;
    }


    function updateEtaUI(data) {
      const minutes = data && data.eta_minutes ? Number(data.eta_minutes) : null;
      const distance = data && data.eta_distance_meters ? Number(data.eta_distance_meters) : null;

      if (Number.isFinite(minutes)) {
        etaChipEl.textContent = minutes + " min";
        etaMainEl.textContent = minutes + " min";
        turnMainEl.textContent = "Live navigation active";
        turnSubEl.textContent = "Route updated through GigChat";
      }

      if (Number.isFinite(distance)) {
        distanceMainEl.textContent = formatDistance(distance) + " remaining";
      }

      updateGpsBanner(data);
    }

    function getProviderPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Location sharing is not available on this device."));
          return;
        }

        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 14000,
          maximumAge: 8000,
        });
      });
    }

    async function requestWakeLock() {
      try {
        if (!("wakeLock" in navigator)) return;
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (_err) {
        wakeLock = null;
      }
    }

    function decodeGooglePolyline(encoded) {
      if (!encoded || typeof encoded !== "string") return [];

      let index = 0;
      let lat = 0;
      let lng = 0;
      const points = [];

      while (index < encoded.length) {
        let b;
        let shift = 0;
        let result = 0;

        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20 && index < encoded.length);

        const deltaLat = (result & 1) ? ~(result >> 1) : result >> 1;

        shift = 0;
        result = 0;

        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20 && index < encoded.length);

        const deltaLng = (result & 1) ? ~(result >> 1) : result >> 1;

        lat += deltaLat;
        lng += deltaLng;

        points.push([lng / 1e5, lat / 1e5]);
      }

      return points;
    }

    function emptyRoute() {
      return {
        type: "FeatureCollection",
        features: [{
          type: "Feature",
          properties: {},
          geometry: {
            type: "LineString",
            coordinates: [],
          },
        }],
      };
    }

    function routeGeoJson(points) {
      return {
        type: "FeatureCollection",
        features: [{
          type: "Feature",
          properties: {},
          geometry: {
            type: "LineString",
            coordinates: points,
          },
        }],
      };
    }


    function tuneGigChatVectorMapStyle() {
      if (!map || !map.getStyle || !map.getStyle()) return;

      const layers = map.getStyle().layers || [];

      layers.forEach((layer) => {
        const id = String(layer.id || "").toLowerCase();

        try {
          if (!map.getLayer(layer.id)) return;

          if (layer.type === "background") {
            map.setPaintProperty(layer.id, "background-color", "#202a36");
          }

          if (layer.type === "fill") {
            if (id.includes("water")) {
              map.setPaintProperty(layer.id, "fill-color", "#1a3348");
              map.setPaintProperty(layer.id, "fill-opacity", 0.95);
            } else if (
              id.includes("park") ||
              id.includes("landuse") ||
              id.includes("green") ||
              id.includes("wood")
            ) {
              map.setPaintProperty(layer.id, "fill-color", "#263949");
              map.setPaintProperty(layer.id, "fill-opacity", 0.78);
            } else if (
              id.includes("building") ||
              id.includes("structure")
            ) {
              map.setPaintProperty(layer.id, "fill-color", "#26303d");
              map.setPaintProperty(layer.id, "fill-opacity", 0.75);
            } else {
              map.setPaintProperty(layer.id, "fill-color", "#202a36");
              map.setPaintProperty(layer.id, "fill-opacity", 0.72);
            }
          }

          if (layer.type === "line") {
            if (
              id.includes("tunnel") ||
              id.includes("bridge") ||
              id.includes("case") ||
              id.includes("casing")
            ) {
              map.setPaintProperty(layer.id, "line-color", "#455b72");
              map.setPaintProperty(layer.id, "line-opacity", 0.72);
            }
            if (
              id.includes("road") ||
              id.includes("street") ||
              id.includes("highway") ||
              id.includes("transportation")
            ) {
              map.setPaintProperty(layer.id, "line-color", "#536d88");
              map.setPaintProperty(layer.id, "line-opacity", 0.82);
            } else if (id.includes("water")) {
              map.setPaintProperty(layer.id, "line-color", "#234a67");
              map.setPaintProperty(layer.id, "line-opacity", 0.85);
            }
          }

          if (layer.type === "symbol") {
            if (map.getPaintProperty(layer.id, "text-color") !== undefined) {
              map.setPaintProperty(layer.id, "text-color", "#f7faff");
              map.setPaintProperty(layer.id, "text-halo-color", "#203041");
              map.setPaintProperty(layer.id, "text-halo-width", 1.25);
              map.setPaintProperty(layer.id, "text-halo-blur", 0.35);
              map.setPaintProperty(layer.id, "text-opacity", 0.96);
            }

            if (map.getPaintProperty(layer.id, "icon-color") !== undefined) {
              map.setPaintProperty(layer.id, "icon-color", "#f7faff");
            }
          }
        } catch (_err) {
          // Some style layers do not support every paint property.
        }
      });
    }

    function createMap(lat, lng) {
      map = new maplibregl.Map({
        container: "map",
        style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
        center: [lng, lat],
        zoom: 17,
        pitch: 64,
        bearing: 0,
        attributionControl: false,
        pitchWithRotate: true,
        dragRotate: true,
      });

      map.on("load", () => {
        tuneGigChatVectorMapStyle();
        map.addSource("route", {
          type: "geojson",
          data: emptyRoute(),
        });

        map.addLayer({
          id: "route-glow",
          type: "line",
          source: "route",
          layout: {
            "line-cap": "round",
            "line-join": "round",
          },
          paint: {
            "line-color": "#ffb3bd",
            "line-width": 18,
            "line-opacity": 0.46,
          },
        });

        map.addLayer({
          id: "route-main",
          type: "line",
          source: "route",
          layout: {
            "line-cap": "round",
            "line-join": "round",
          },
          paint: {
            "line-color": "#ff405f",
            "line-width": 9,
            "line-opacity": 0.95,
          },
        });

        map.addSource("destination", {
          type: "geojson",
          data: {
            type: "FeatureCollection",
            features: [{
              type: "Feature",
              geometry: {
                type: "Point",
                coordinates: [lng, lat],
              },
            }],
          },
        });

        map.addLayer({
          id: "destination-dot",
          type: "circle",
          source: "destination",
          paint: {
            "circle-radius": 0,
            "circle-color": "#7c3cff",
            "circle-stroke-width": 6,
            "circle-stroke-color": "#ffffff",
            "circle-opacity": 0,
          },
        });

        navBtn.disabled = false;
      });
    }

    function bearingBetween(a, b) {
      const lon1 = a[0] * Math.PI / 180;
      const lat1 = a[1] * Math.PI / 180;
      const lon2 = b[0] * Math.PI / 180;
      const lat2 = b[1] * Math.PI / 180;

      const y = Math.sin(lon2 - lon1) * Math.cos(lat2);
      const x =
        Math.cos(lat1) * Math.sin(lat2) -
        Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);

      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function closestPointOnSegment(p, a, b) {
      const apx = p.x - a.x;
      const apy = p.y - a.y;
      const abx = b.x - a.x;
      const aby = b.y - a.y;
      const ab2 = abx * abx + aby * aby;

      if (ab2 === 0) return a;

      let t = (apx * abx + apy * aby) / ab2;
      t = Math.max(0, Math.min(1, t));

      return { x: a.x + abx * t, y: a.y + aby * t, indexRatio: t };
    }

    function nearestRoutePoint(lng, lat) {
      if (!routePoints.length || !map) return [lng, lat, map ? map.getBearing() : 0];

      const providerScreenPoint = map.project([lng, lat]);
      let bestScreenPoint = null;
      let bestDistance = Infinity;
      let bestIndex = 0;

      for (let i = 0; i < routePoints.length - 1; i++) {
        const a = map.project(routePoints[i]);
        const b = map.project(routePoints[i + 1]);
        const candidate = closestPointOnSegment(providerScreenPoint, a, b);

        const dx = providerScreenPoint.x - candidate.x;
        const dy = providerScreenPoint.y - candidate.y;
        const distance = dx * dx + dy * dy;

        if (distance < bestDistance) {
          bestDistance = distance;
          bestScreenPoint = candidate;
          bestIndex = i;
        }
      }

      if (!bestScreenPoint) return [lng, lat, map.getBearing()];

      const snapped = map.unproject(bestScreenPoint);
      const current = [snapped.lng, snapped.lat];
      const next = routePoints[Math.min(bestIndex + 1, routePoints.length - 1)];
      const bearing = bearingBetween(current, next);

      return [current[0], current[1], bearing];
    }

    function drawEncodedRoute(encoded) {
      const points = decodeGooglePolyline(encoded);
      if (points.length < 2 || !map || !map.getSource("route")) return false;

      routePoints = points;
      map.getSource("route").setData(routeGeoJson(points));

      return true;
    }


    function setProviderMarker(lng, lat, bearing) {
      if (!map) return;

      if (!providerMarker) {
        const el = document.createElement("div");
        el.className = "nav-arrow-marker";

        providerMarker = new maplibregl.Marker({
          element: el,
          anchor: "center",
          rotationAlignment: "map",
          pitchAlignment: "map",
        })
          .setLngLat([lng, lat])
          .addTo(map);
      } else {
        providerMarker.setLngLat([lng, lat]);
      }

      if (providerMarker && typeof providerMarker.setRotation === "function") {
        providerMarker.setRotation(Number.isFinite(bearing) ? bearing : 0);
      }
    }

    function cameraToProvider(lng, lat, bearing) {
      if (!map) return;

      map.easeTo({
        center: [lng, lat],
        zoom: 17.7,
        pitch: 64,
        bearing: Number.isFinite(bearing) ? bearing : map.getBearing(),
        duration: 800,
        padding: {
          top: 130,
          bottom: 330,
          left: 0,
          right: 0,
        },
      });
    }

    function updateProviderCamera(rawLat, rawLng) {
      const snapped = nearestRoutePoint(rawLng, rawLat);
      lastProviderPoint = snapped;

      setProviderMarker(snapped[0], snapped[1], snapped[2]);

      if (followProvider) {
        cameraToProvider(snapped[0], snapped[1], snapped[2]);
      }
    }

    async function sendProviderLocationPing(position) {
      const coords = position.coords || {};

      const res = await fetch(API_BASE + "?task=provider_location_ping", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          token: currentToken,
          latitude: coords.latitude,
          longitude: coords.longitude,
          accuracy: coords.accuracy,
        }),
      });

      const data = await res.json();

      if (!res.ok || !data.ok) {
        throw new Error(data.error || "Could not send live ETA.");
      }

      return data;
    }

    async function handlePosition(position, forcePing) {
      const coords = position.coords || {};

      if (!Number.isFinite(coords.latitude) || !Number.isFinite(coords.longitude)) {
        throw new Error("Invalid provider location.");
      }

      updateProviderCamera(coords.latitude, coords.longitude);

      const now = Date.now();
      const shouldPing = forcePing || now - lastPingAt >= 30000;

      if (!shouldPing) return;

      lastPingAt = now;
      setStatus("Updating live ETA...");

      const eta = await sendProviderLocationPing(position);
      updateEtaUI(eta);

      const routeLoaded = drawEncodedRoute(eta && eta.encoded_polyline);
      updateProviderCamera(coords.latitude, coords.longitude);

      if (routeLoaded && eta && eta.customer_notified) {
        setStatus("Route loaded. Customer notified.");
      } else if (routeLoaded) {
        setStatus("Route loaded.");
      } else {
        setStatus("Waiting for 3D route.");
      }
    }

    async function startLiveNavigation() {
      navBtn.disabled = true;
      navBtn.textContent = "Starting...";
      setStatus("Requesting location permission...");

      try {
        followProvider = true;
        if (screenEl) screenEl.classList.add("live");
        await requestWakeLock();

        const position = await getProviderPosition();
        await handlePosition(position, true);

        turnMainEl.textContent = "Live navigation active";
        turnSubEl.textContent = "Keep this page open for live route";
        navBtn.textContent = "Navigation on";
        navBtn.disabled = true;

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
        }

        watchId = navigator.geolocation.watchPosition(
          async (nextPosition) => {
            try {
              await handlePosition(nextPosition, false);
            } catch (err) {
              console.warn("3D LIVE ETA UPDATE FAILED:", err);
              setStatus("Live ETA paused. Checking again...");
            }
          },
          (err) => {
            console.warn("LOCATION WATCH FAILED:", err);
            setStatus("Location permission is needed for live ETA.");
          },
          {
            enableHighAccuracy: true,
            timeout: 16000,
            maximumAge: 8000,
          }
        );
      } catch (err) {
        console.warn("3D LIVE NAVIGATION START FAILED:", err);
        navBtn.disabled = false;
        navBtn.textContent = "Start";
        const message = err && err.message ? err.message : String(err || "Unknown error");
        setStatus("Navigation failed: " + message.slice(0, 140));
      }
    }

    function recenter() {
      followProvider = true;

      if (lastProviderPoint) {
        cameraToProvider(lastProviderPoint[0], lastProviderPoint[1], lastProviderPoint[2]);
        return;
      }

      if (Number.isFinite(exactLat) && Number.isFinite(exactLng)) {
        cameraToProvider(exactLng, exactLat, 0);
      }
    }

    async function load() {
      const token = getToken();
      currentToken = token;

      if (!token) {
        throw new Error("Missing navigation token.");
      }

      const res = await fetch(
        API_BASE + "?task=provider_job_data&token=" + encodeURIComponent(token)
      );

      const data = await res.json();

      if (!data.ok || !data.job) {
        throw new Error(data.error || "Job not found.");
      }

      const job = data.job;

      exactLat = Number(job.service_latitude);
      exactLng = Number(job.service_longitude);

      if (!Number.isFinite(exactLat) || !Number.isFinite(exactLng)) {
        throw new Error("This job does not have map coordinates yet.");
      }

      createMap(exactLat, exactLng);

      navBtn.addEventListener("click", startLiveNavigation);
      recenterBtn.addEventListener("click", recenter);

      setStatus("Tap Start when you are on the way.");
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && wakeLock === null && watchId !== null) {
        await requestWakeLock();
      }
    });

    load().catch((err) => {
      showError(err.message || "Something went wrong.");
    });
  </script>
</body>
</html>

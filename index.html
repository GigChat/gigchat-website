<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GigChat</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>

<button class="language-toggle" id="languageToggle" type="button">ES</button>

  <main class="hero">
    <video id="heroVideo" class="hero-video" autoplay muted loop playsinline preload="auto">
      <source src="gigchat-video.mp4" type="video/mp4" />
    </video>

<form class="request-bar" id="requestForm">
  <span class="plus-icon">+</span>

  <input
    id="requestInput"
    type="text"
    placeholder="What do you want to request?"
    autocomplete="off"
  />

  <button type="submit" class="voice-button">
    ↑
  </button>
</form>

<p class="request-status" id="requestStatus"></p>

<div class="channel-choice" id="channelChoice" hidden>
  <button type="button" data-channel="whatsapp">WhatsApp</button>
  <button type="button" data-channel="sms">SMS</button>
</div>

    <div class="bottom-copy">
  <p class="quote" id="quoteText">
    "The future won't be downloaded. It will be requested"
  </p>

  <p class="terms" id="termsText">
  By messaging GigChat, you agree to our
  <span class="terms-links">
    <a href="terms.html">Terms</a>
    <span class="terms-separator">•</span>
    <a href="privacy.html">Privacy Policy</a>
    <span class="terms-separator">•</span>
    <a href="sms-opt-in.html">SMS Opt-In</a>
  </span>
</p>

  <p class="copyright" id="copyrightText">
    Copyright ©️ 2026 GigChat - All Rights Reserved
  </p>
</div>
  </main>

<script>
  const form = document.getElementById("requestForm");
  const input = document.getElementById("requestInput");
  const status = document.getElementById("requestStatus");
  const button = form.querySelector(".voice-button");
  const plusIcon = form.querySelector(".plus-icon");
  const channelChoice = document.getElementById("channelChoice");
  const languageToggle = document.getElementById("languageToggle");
  const quoteText = document.getElementById("quoteText");
  const termsText = document.getElementById("termsText");
  const copyrightText = document.getElementById("copyrightText");
  const heroVideo = document.getElementById("heroVideo");

  const SUPABASE_FUNCTION_URL = "https://ohpsfazyxduzacwdjyrv.supabase.co/functions/v1/gigchat-request";

  let step = "request";
  let savedRequest = "";
  let savedPhone = "";
  let isTyping = false;
  let currentLang = localStorage.getItem("gigchat_lang") || "en";

  const copy = {
    en: {
      requestPlaceholder: "What do you want to request?",
      phonePlaceholder: "Where should GigChat text you?",
      channelPlaceholder: "Choose WhatsApp or SMS below.",
      receivedPlaceholder: "Request received.",
      sendingPlaceholder: "Sending request...",
      emptyRequest: "Type what you want to request first.",
      emptyPhone: "Enter your phone number to continue.",
      gotIt: (request) => `Got it — “${request}”`,
      handoffQuestion: "How should GigChat continue with you?",
      finalWhatsapp: (phone) => `Request received. We’ll continue by WhatsApp at ${phone}.`,
      finalSms: (phone) => `Request received. We’ll continue by SMS at ${phone}.`,
      error: "Something went wrong. Please try again.",
      tryAgain: "Try again or check your connection.",
      quote: `"The future won't be downloaded. It will be requested"`,
termsHtml:
  `By messaging GigChat, you agree to our
  <span class="terms-links">
    <a href="terms.html">Terms</a>
    <span class="terms-separator">•</span>
    <a href="privacy.html">Privacy Policy</a>
    <span class="terms-separator">•</span>
    <a href="sms-opt-in.html">SMS Opt-In</a>
  </span>`,
copyright: "Copyright ©️ 2026 GigChat - All Rights Reserved",
      toggleLabel: "ES"
    },
    es: {
      requestPlaceholder: "¿Qué quieres pedir?",
      phonePlaceholder: "¿Dónde debe escribirte GigChat?",
      channelPlaceholder: "Elige WhatsApp o SMS abajo.",
      receivedPlaceholder: "Solicitud recibida.",
      sendingPlaceholder: "Enviando solicitud...",
      emptyRequest: "Escribe primero lo que quieres pedir.",
      emptyPhone: "Ingresa tu número para continuar.",
      gotIt: (request) => `Entendido — “${request}”`,
      handoffQuestion: "¿Cómo debe continuar GigChat contigo?",
      finalWhatsapp: (phone) => `Solicitud recibida. Seguiremos por WhatsApp al ${phone}.`,
      finalSms: (phone) => `Solicitud recibida. Seguiremos por SMS al ${phone}.`,
      error: "Algo salió mal. Inténtalo de nuevo.",
      tryAgain: "Intenta de nuevo o revisa tu conexión.",
      quote: `"El futuro no se descargará. Se pedirá."`,
      termsHtml:
  `Al escribirle a GigChat, aceptas nuestros
  <span class="terms-links">
    <a href="terms.html">Términos</a>
    <span class="terms-separator">•</span>
    <a href="privacy.html">Privacidad</a>
    <span class="terms-separator">•</span>
    <a href="sms-opt-in.html">SMS Opt-In</a>
  </span>`,
      copyright: "Copyright ©️ 2026 GigChat - Todos los derechos reservados",
      toggleLabel: "EN"
    }
  };

  function t(key, value) {
    const item = copy[currentLang][key];
    return typeof item === "function" ? item(value) : item;
  }

  function applyLanguage() {
    languageToggle.textContent = t("toggleLabel");

    quoteText.textContent = t("quote");
    termsText.innerHTML = t("termsHtml");
    copyrightText.textContent = t("copyright");

    if (step === "request") {
      input.placeholder = t("requestPlaceholder");
    }

    if (step === "phone") {
      input.placeholder = t("phonePlaceholder");
    }

    if (step === "channel") {
      input.placeholder = t("channelPlaceholder");
    }
  }

  languageToggle.addEventListener("click", function () {
    currentLang = currentLang === "en" ? "es" : "en";
    localStorage.setItem("gigchat_lang", currentLang);
    applyLanguage();
  });

  function lockBar() {
    input.disabled = true;
    button.disabled = true;
    plusIcon.textContent = "✦";
  }

  function unlockBar() {
    input.disabled = false;
    button.disabled = false;
    plusIcon.textContent = "+";
  }

  function showThinking(callback) {
    isTyping = true;
    status.textContent = ".";

    const frames = [".", "..", "..."];
    let index = 0;

    const thinking = setInterval(function () {
      status.textContent = frames[index];
      index = (index + 1) % frames.length;
    }, 420);

    setTimeout(function () {
      clearInterval(thinking);
      status.textContent = "";

      if (callback) callback();
    }, 1400);
  }

  function typeText(text, callback) {
    status.textContent = "";
    let i = 0;

    const typing = setInterval(function () {
      status.textContent += text.charAt(i);
      i++;

      if (i >= text.length) {
        clearInterval(typing);
        isTyping = false;

        if (callback) {
          setTimeout(callback, 500);
        }
      }
    }, 28);
  }

  function keepHeroVideoPlaying() {
  if (!heroVideo) return;

  heroVideo.muted = true;
  heroVideo.defaultMuted = true;
  heroVideo.loop = true;
  heroVideo.playsInline = true;

  const tryPlay = function () {
    if (document.hidden) return;

    heroVideo.play().catch(function () {
      // iPhone/Safari may block autoplay until the next touch.
    });
  };

  tryPlay();
  setTimeout(tryPlay, 250);
  setTimeout(tryPlay, 900);
}

  document.addEventListener("visibilitychange", function () {
  if (!document.hidden) keepHeroVideoPlaying();
});

window.addEventListener("pageshow", keepHeroVideoPlaying);
window.addEventListener("focus", keepHeroVideoPlaying);
window.addEventListener("blur", keepHeroVideoPlaying);

document.addEventListener("touchstart", keepHeroVideoPlaying);
document.addEventListener("click", keepHeroVideoPlaying);

heroVideo.addEventListener("pause", function () {
  if (!document.hidden) {
    setTimeout(keepHeroVideoPlaying, 300);
  }
});

setInterval(function () {
  if (!document.hidden) keepHeroVideoPlaying();
}, 2000);

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    if (isTyping) return;

    const value = input.value.trim();

    if (!value) {
      isTyping = true;
      typeText(step === "request" ? t("emptyRequest") : t("emptyPhone"));
      return;
    }

    if (step === "request") {
      savedRequest = value;
      step = "phone";

      lockBar();

      showThinking(function () {
        typeText(t("gotIt", savedRequest), function () {
          input.value = "";
          input.type = "tel";
          input.placeholder = t("phonePlaceholder");

          unlockBar();

          button.textContent = "→";
          status.textContent = "";

          input.focus();
        });
      });

      return;
    }

    if (step === "phone") {
      savedPhone = value;
      step = "channel";

      input.value = "";
      input.placeholder = t("channelPlaceholder");

      lockBar();
      button.textContent = "•";

      showThinking(function () {
        typeText(t("handoffQuestion"), function () {
          input.disabled = true;
          button.disabled = true;
          plusIcon.textContent = "✦";
          channelChoice.hidden = false;
        });
      });

      return;
    }
  });

  channelChoice.addEventListener("click", async function (event) {
    const selectedButton = event.target.closest("button");
    if (!selectedButton) return;

    const channel = selectedButton.dataset.channel;

    channelChoice.hidden = true;

    input.placeholder = t("sendingPlaceholder");
    button.textContent = "•";
    plusIcon.textContent = "✦";

    isTyping = true;

    showThinking(async function () {
      try {
        const response = await fetch(SUPABASE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            request_text: savedRequest,
            phone: savedPhone,
            preferred_channel: channel
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Request failed");
        }

        if (result.twilio_error) {
          throw new Error(result.twilio_error);
        }

        input.placeholder = t("receivedPlaceholder");
        button.textContent = "✓";

        const finalMessage =
          channel === "whatsapp"
            ? t("finalWhatsapp", savedPhone)
            : t("finalSms", savedPhone);

        typeText(finalMessage);

        console.log("Saved to Supabase:", result);
      } catch (error) {
        console.error(error);

        input.disabled = false;
        button.disabled = false;
        button.textContent = "→";
        plusIcon.textContent = "+";
        input.placeholder = t("tryAgain");

        typeText(t("error"));
      }
    });
  });

  applyLanguage();
  keepHeroVideoPlaying();
</script>

</body>
</html>
